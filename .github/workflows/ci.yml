name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake \
            curl \
            g++ \
            golang-go \
            libboost-dev \
            libgmock-dev \
            libgtest-dev \
            libspdlog-dev \
            libsqlite3-dev \
            ninja-build \
            nlohmann-json3-dev \
            qt6-base-dev

      - name: Check documentation links
        run: python3 scripts/check_docs_links.py

      - name: Build and test inspector
        working-directory: tools/inspector
        run: go test ./...

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_CLIENT=ON
          -DBUILD_SERVER=ON
          -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --timeout 120

      - name: Run API smoke test
        run: python3 build.py smoke

      - name: Run GUI startup smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 build.py smoke-gui
